[package]
name = "alacer-inspect"
description = "Alacer's Causality inspector: dev-mode causal capture, the documented WS protocol, and the embedded standalone client (§13.3)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
alacer-core.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1.workspace = true
base64.workspace = true
# The session-error report (ADR-0029): the accept loop's observability —
# the adopted core every other crate already rides, so no new dependency
# enters the graph.
tracing.workspace = true

[dev-dependencies]
# The replay burst's cost benchmark (`benches/replay.rs`): the connect-time
# price the reconnection experience pays, measured like every other
# workspace contract.
criterion.workspace = true
# The m83 exit suite's pipeline fakes sign the layout stage's dirty map —
# the same hash map the core trait's signatures name (the test-only shape).
rustc-hash.workspace = true

[[bench]]
name = "replay"
harness = false

[[bench]]
name = "gate"
harness = false
