[package]
name = "alacer-text"
description = "Alacer's text: a parley/fontique/swash facade with shaped-glyph layout and an evicting layout cache"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
alacer-core.workspace = true
parley.workspace = true
swash.workspace = true
zeno = "0.3.3"
rustc-hash.workspace = true
# The word-boundary tables the text seam's segmentation rides (ADR-0019):
# ICU's UAX #29 WordSegmenter — the same segmenter parley's engine adopts
# for line breaking, dictionary-backed for Thai and friends.
icu_segmenter = { version = "2.4.0", default-features = false, features = ["auto", "compiled_data"] }

[dev-dependencies]
criterion.workspace = true
linebender_resource_handle = "0.1.1"

[[bench]]
name = "layout"
harness = false
