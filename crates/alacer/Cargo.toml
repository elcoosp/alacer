[package]
name = "alacer"
description = "Alacer: a retained-mode Rust UI framework where reactivity, layout, paint, and accessibility consume one shared invalidation currency. Facade crate: prelude and re-exports"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[features]
default = ["backend-wgpu", "backend-softbuffer"]
backend-wgpu = ["alacer-platform/backend-wgpu"]
backend-softbuffer = ["alacer-platform/backend-softbuffer"]
# Hot reload (ADR-7, §13.2): links `subsecond`, wraps the view generation in
# `subsecond::call`, and answers binary patches with one scoped re-render.
hot-reload = ["dep:subsecond"]

[dependencies]
alacer-core.workspace = true
alacer-macro.workspace = true
alacer-layout.workspace = true
alacer-text.workspace = true
alacer-render.workspace = true
alacer-a11y.workspace = true
alacer-view.workspace = true
alacer-widgets.workspace = true
alacer-platform.workspace = true
alacer-inspect.workspace = true
reactive_graph.workspace = true
alacer-testing.workspace = true
subsecond = { workspace = true, optional = true }

[dev-dependencies]
# The observability idiom the examples demonstrate (ADR-0022): tracing at
# the documented targets — a dev-dependency, so nothing published moves.
tracing.workspace = true
