name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  verify:
    name: verify before release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Rust (rust-toolchain.toml)
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: tests
        run: cargo test --workspace --all-features
      - name: DAG check
        run: python3 scripts/check_dag.py

  changelog:
    name: changelog (git-cliff)
    runs-on: ubuntu-latest
    needs: verify
    outputs:
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff
      - name: Generate the release notes
        id: notes
        run: |
          # Notes for this tag only + an updated full CHANGELOG.md for the repo.
          git-cliff --unreleased --strip all > RELEASE_NOTES.md
          git-cliff > CHANGELOG.md
          {
            echo "notes<<EOF"
            cat RELEASE_NOTES.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Upload the release notes artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: RELEASE_NOTES.md
      - name: Commit the refreshed CHANGELOG
        run: |
          git config user.name "alacer-release-bot"
          git config user.email "release@alacer.local"
          git add CHANGELOG.md
          git commit -m "docs: update CHANGELOG for ${{ github.ref_name }} [skip ci]" || echo "no changelog changes"
          git push

  build:
    name: build examples (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: verify
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust (rust-toolchain.toml)
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - name: Build release examples
        run: cargo build --release -p alacer --examples
      - name: Stage artifacts
        shell: bash
        run: |
          mkdir -p dist
          for bin in counter counter_view scrolling_list; do
            for f in target/release/examples/"$bin"*; do
              [ -f "$f" ] && cp "$f" dist/alacer-"$bin"-"$RUNNER_OS"$( [ "${f##*.}" = "exe" ] && echo ".exe" )
            done
          done
          ls -la dist
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: alacer-examples-${{ matrix.os }}
          path: dist/

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [changelog, build]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: dist
      - name: Create the GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: dist/RELEASE_NOTES.md
          generate_release_notes: false
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
