# cargo-deny configuration (ADR-9: license gate — no AGPL, no unknown licenses;
# the audit's provenance rules, carried forward).

[graph]
all-features = true

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
]
# The workspace itself is MIT OR Apache-2.0; every adopted core dep is MIT
# and/or Apache-2.0 (architecture section 20). GPL-family is denied outright by
# the allow-list above (cargo-deny >= 0.18 removed the `deny` key — anything
# outside `allow` fails the gate): sources are never copied (clean-room
# discipline), and AGPL is refused.
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "warn"
deny = []
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
