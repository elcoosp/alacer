name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust (rust-toolchain.toml)
        run: rustup show active-toolchain
      - name: rustfmt
        run: cargo fmt --all --check

  clippy:
    name: clippy (pedantic, -D warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust (rust-toolchain.toml)
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - name: clippy --all-targets --all-features
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: test (headless, software backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust (rust-toolchain.toml)
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - name: Snapshot diagnostics on failure
        run: echo "ALACER snapshot corpus lives in crates/alacer-testing/blessed/"
      - name: tests
        run: cargo test --workspace --all-features
      - name: doctests
        run: cargo test --workspace --doc

  doc:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust (rust-toolchain.toml)
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - name: cargo doc
        run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  dag:
    name: layering DAG (ADR-9)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check the crate layering
        run: python3 scripts/check_dag.py

  hot-patch:
    name: hot-patch suite (M4, ADR-7/ADR-0010)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust (rust-toolchain.toml)
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - name: The hot-patch contract (state intact, scoped, one frame)
        run: cargo test -p alacer-testing --test m4_exit_criteria
      - name: The subsecond wiring (feature-gated)
        run: cargo test -p alacer --features hot-reload --test hot_reload_subsecond
      - name: The hot-reload demo compiles under the feature
        run: cargo build -p alacer --features hot-reload --examples

  deny:
    name: cargo-deny (licenses/bans)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans

  bench:
    name: benchmarks compile + smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust (rust-toolchain.toml)
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - name: Compile all benches
        run: cargo bench --workspace --no-run
      - name: Smoke the reconciliation bench
        run: cargo bench -p alacer-view --bench view -- --warm-up-time 1 --measurement-time 2

  windows:
    name: windows build (smoke)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust (rust-toolchain.toml)
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - name: Headless tests (software backend)
        run: cargo test -p alacer-core -p alacer-layout -p alacer-view -p alacer-widgets -p alacer-a11y
