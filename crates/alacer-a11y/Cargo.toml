[package]
name = "alacer-a11y"
description = "Alacer's accessibility: the AccessKit contract with incremental TreeUpdates built from dirty nodes only (ADR-5)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
alacer-core.workspace = true
accesskit.workspace = true
rustc-hash.workspace = true

[dev-dependencies]
criterion.workspace = true
# The canon tree-shape proof (tests/canon_tree_shape.rs): the *composed*
# canons ride the headless harness (TestHarness + the real pipeline) so the
# proof reads this crate's own sink output — a dev-only cycle (alacer-testing
# depends on alacer-a11y), the shape cargo's dev-dependencies exist for. The
# runtime DAG stays foundation-only (ADR-9); the edges are dev-scoped and
# pinned in scripts/check_dag.py's allowed set.
alacer-widgets.workspace = true
alacer-testing.workspace = true

[[bench]]
name = "tree_update"
harness = false
