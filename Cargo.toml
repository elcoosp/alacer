[workspace]
resolver = "3"
members = [
    "crates/alacer",
    "crates/alacer-core",
    "crates/alacer-macro",
    "crates/alacer-layout",
    "crates/alacer-text",
    "crates/alacer-render",
    "crates/alacer-a11y",
    "crates/alacer-view",
    "crates/alacer-widgets",
    "crates/alacer-platform",
    "crates/alacer-testing",
    "crates/alacer-inspect",
]

[workspace.package]
version = "0.16.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
authors = ["The Alacer Developers"]
repository = "https://github.com/alacer-rs/alacer"
homepage = "https://github.com/alacer-rs/alacer"
keywords = ["gui", "ui", "widgets", "accessibility", "reactive"]
categories = ["gui", "development-tools"]
readme = "README.md"

# ADR-9 (workspace & discipline): `missing_docs` + `unsafe_code` deny, Iced precedent.
# Clippy pedantic fires on every member (each crate opts in via
# `[lints] workspace = true`) and the CI `-D warnings` denies it — there is
# no allow-list anywhere in this workspace; the only suppressions are
# reasoned `#[expect]`s at the documented cast seams.
[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

[workspace.dependencies]
# Internal crates — layering is a DAG, enforced by `scripts/check_dag.py` in CI (ADR-9).
# The pins ride `[workspace.package]`'s version: the 0.12.0 family publishes
# (and resolves, see ADR-0022) as one cut, never pairing with an older core.
alacer = { path = "crates/alacer", version = "0.16.0" }
alacer-core = { path = "crates/alacer-core", version = "0.16.0" }
alacer-macro = { path = "crates/alacer-macro", version = "0.16.0" }
alacer-layout = { path = "crates/alacer-layout", version = "0.16.0" }
alacer-text = { path = "crates/alacer-text", version = "0.16.0" }
alacer-render = { path = "crates/alacer-render", version = "0.16.0" }
alacer-a11y = { path = "crates/alacer-a11y", version = "0.16.0" }
alacer-view = { path = "crates/alacer-view", version = "0.16.0" }
alacer-widgets = { path = "crates/alacer-widgets", version = "0.16.0" }
alacer-platform = { path = "crates/alacer-platform", version = "0.16.0" }
alacer-testing = { path = "crates/alacer-testing", version = "0.16.0" }
alacer-inspect = { path = "crates/alacer-inspect", version = "0.16.0" }

# Adopted cores (A2 — steal proven cores; own only the composition).
# `effects` gates ImmediateEffect — the synchronous, batch-coalescing effect
# type our scheduling contract (ADR-6) is built on.
reactive_graph = { version = "0.2.16", features = ["effects"] }
taffy = "0.15.1"
parley = "0.12.0"
swash = "0.2.10"
accesskit = "0.25.2"
accesskit_winit = "0.34.2"
winit = "0.30.13"
wgpu = "30.0.1"
tiny-skia = "0.12.0"
softbuffer = "0.4.8"
raw-window-handle = "0.6.2"
# The clipboard round trip (ADR-0020): the adopted core the clipboard
# seam's engine rides — the platform owns the adapter dependency (ADR-9),
# widgets only ever see the seam in core.
arboard = "3.7.0"
# UAX #29 word segmentation — the text seam's word contract (ADR-0019).
# Already in the graph through parley's engine; alacer-text adopts it
# explicitly for the word-boundary tables the seam answers with.
icu_segmenter = { version = "2.4.0", default-features = false, features = ["auto", "compiled_data"] }

# Small, permissive utilities.
bitflags = "2.13.2"
euclid = "0.22.14"
rustc-hash = "2.1.3"
tracing = "0.1.44"
criterion = "0.8.2"

# The Causality inspector's wire (ADR-0010): JSON protocol + RFC 6455
# handshake primitives. Adopted, not written (audit PRIMITIVES P8).
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha1 = "0.10.6"
base64 = "0.22.1"

# Hot reload (ADR-7, §13.2): the jump-table patching runtime, adopted as-is.
# Optional — only the facade's `hot-reload` feature links it.
subsecond = "0.7.10"

# The rsx! proc-macro toolchain (alacer-macro; the view DSL compiler).
proc-macro2 = "1.0.103"
quote = "1.0.42"
syn = { version = "2.0.108", features = ["full"] }

[profile.dev]
# Keep dependency builds cheap on constrained machines: no debug info in dev/test.
debug = 0

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
